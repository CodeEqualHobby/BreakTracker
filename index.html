<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Tracker - Under Construction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)),
                        url('logo-background.jpg') center/cover no-repeat fixed;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .content {
            max-width: 700px;
            padding: 40px 20px;
        }

        .logo {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
            background: url('logo-background.jpg') center/contain no-repeat;
            filter: drop-shadow(0 0 30px rgba(100, 200, 255, 0.6));
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        p {
            font-size: 1.35rem;
            line-height: 1.6;
            opacity: 0.95;
            margin-bottom: 30px;
        }

        .coffee {
            font-size: 4rem;
            margin: 20px 0;
            animation: coffeeShake 2s infinite;
        }

        @keyframes coffeeShake {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="content">
        <div class="logo"></div>
        
        <h1>Break Tracker</h1>
        <p style="font-size: 1.5rem; margin-bottom: 10px;">Under Construction</p>
        <p>This tracker is currently being rebuilt.<br>
           I need more ☕ coffee to make it perfect.</p>
        
        <div class="coffee">☕☕☕</div>
        
        <a href="#" onclick="alert('Thanks for your patience! 🚀')" class="btn">
            I'll be back soon
        </a>
    </div>

    <script>
        // Optional: Auto-refresh every 30 seconds (remove if not needed)
        // setTimeout(() => location.reload(), 30000);
    </script>
</body>
</html>
